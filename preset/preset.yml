schema_version: '1.0'
preset:
  id: engineering
  name: Engineering domains
  version: 1.0.0
  description: Embedded, Python and data science requirements for official Spec Kit
requires:
  speckit_version: ==1.0.4
provides:
  templates:
  - type: template
    name: constitution-template
    file: templates/constitution-template.md
    strategy: append
  - type: template
    name: spec-template
    file: templates/spec-template.md
    strategy: append
  - type: template
    name: plan-template
    file: templates/plan-template.md
    strategy: append
  - type: template
    name: tasks-template
    file: templates/tasks-template.md
    strategy: append
  - type: command
    name: speckit.specify
    file: commands/specify.md
    strategy: prepend
  - type: command
    name: speckit.plan
    file: commands/plan.md
    strategy: prepend
  - type: command
    name: speckit.tasks
    file: commands/tasks.md
    strategy: prepend
  - type: command
    name: speckit.implement
    file: commands/implement.md
    strategy: prepend
  - type: command
    name: speckit.analyze
    file: commands/analyze.md
    strategy: prepend
  - type: command
    name: speckit.constitution
    file: commands/constitution.md
    strategy: prepend
  - type: command
    name: speckit.converge
    file: commands/converge.md
    strategy: prepend
