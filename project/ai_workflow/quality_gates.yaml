schema_version: '1.0'
severity:
  blocker: Must be fixed before human merge approval.
  major: Must be fixed or explicitly accepted by the accountable human.
  minor: May be deferred with a tracked reason.
  note: Informational.
required_gates:
  scope:
  - acceptance_criteria_traced
  - no_unrelated_changes
  build:
  - required_toolchains_pass
  - warnings_do_not_exceed_baseline
  correctness:
  - unit_tests_pass
  - integration_tests_pass_when_applicable
  - negative_and_boundary_cases_covered
  c_cpp:
  - no_new_undefined_behaviour
  - ownership_and_lifetime_are_clear
  - integer_and_buffer_boundaries_checked
  - concurrency_and_interrupt_context_reviewed
  - error_and_cleanup_paths_reviewed
  embedded:
  - target_constraints_respected
  - memory_and_timing_budgets_respected
  - hardware_assumptions_documented
  - host_only_evidence_not_presented_as_hardware_evidence
  analysis:
  - configured_static_analysis_passes
  - sanitizer_gate_passes_when_supported
  compatibility:
  - api_abi_wire_and_persistence_impact_recorded
  documentation:
  - public_behaviour_and_operational_changes_documented
  evidence:
  - commands_and_results_recorded
  - residual_risks_recorded
  - reviewer_and_verifier_use_exact_commit
  python:
  - locked_environment_reproduced
  - configured_lint_and_type_checks_pass
  - unit_and_integration_tests_pass
  data_science:
  - dataset_and_split_versions_recorded
  - leakage_checks_completed
  - baseline_comparison_recorded
  - evaluation_protocol_fixed_before_final_evaluation
  - reproducibility_limits_reported
domain_gate_policy:
  source: ai_workflow/domain_profiles.md
  selection: project.active_domains and task scope
  rule: Apply c_cpp and embedded groups only to applicable targets. Record any inapplicable
    gate and reason.
