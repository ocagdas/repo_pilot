schema_version: "1.0"

commands:
  configure_host:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  build_focused:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  format_changed:
    command: CUSTOMISE
    working_directory: .
    mutates_source: true
    requires_human_approval: false
  format_check:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  test_focused:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  build_all_required:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  test_all_required:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  static_analysis:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  sanitizers:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  coverage:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  documentation_check:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  hardware_test:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: true
  package:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: true
  deploy:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: true
  knowledge_index_full:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  knowledge_index_incremental:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  knowledge_index_validate:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  knowledge_index_fetch:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: false
  knowledge_index_publish:
    command: CUSTOMISE
    working_directory: .
    mutates_source: false
    requires_human_approval: true

profiles:
  development_focused:
    required:
      - format_changed
      - build_focused
      - test_focused
  implementation_complete:
    required:
      - format_check
      - build_all_required
      - test_all_required
      - static_analysis
      - documentation_check
    when_supported:
      - sanitizers
      - coverage
  release_candidate:
    inherits: implementation_complete
    requires_explicit_authorisation:
      - hardware_test
      - package
  knowledge_refresh:
    required:
      - knowledge_index_incremental
      - knowledge_index_validate
