schema_version: '1.0'
extension:
  id: engineering
  name: Engineering workflow support
  version: 1.0.0
  description: Knowledge refresh, assessment, testing, review and completion reporting
requires:
  speckit_version: ==1.0.4
provides:
  commands:
  - name: speckit.engineering.discuss
    file: commands/discuss.md
    description: Discuss with engineering context
  - name: speckit.engineering.assess
    file: commands/assess.md
    description: Assess with engineering context
  - name: speckit.engineering.bootstrap
    file: commands/bootstrap.md
    description: Bootstrap with engineering context
  - name: speckit.engineering.test
    file: commands/test.md
    description: Test with engineering context
  - name: speckit.engineering.review
    file: commands/review.md
    description: Review with engineering context
  - name: speckit.engineering.report
    file: commands/report.md
    description: Report with engineering context
