name: Bug report
description: Report a reproducible problem using a minimal, redacted example.
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Repo Pilot version/commit, Python version, OS, installation mode and backend.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a disposable repository and dummy credentials. Do not include private source or graph bundles.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or test evidence
