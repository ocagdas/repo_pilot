name: Verify published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify-release:
    if: vars.REPO_PILOT_VERIFY_PUBLISHED_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = false
          gh release download "$TAG" --dir "$RUNNER_TEMP/release"
          python scripts/verify_release.py --directory "$RUNNER_TEMP/release" --tag "$TAG" --commit "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/evidence/artifacts.json"
      - name: Qualify downloaded wheel and consumer payload
        run: python scripts/verify_release_install.py "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-release-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
